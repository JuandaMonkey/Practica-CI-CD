
name: Practica CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. descargar el repositorio y todas sus etiquetas
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. ejecutar pruebas de calidad
      - name: Ejecutar pruebas de calidad
        run: node tests/pruebas.js

      # 4. guardar logs incluso cuando fallen las pruebas
      - name: Guardar registros de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-calidad
          path: logs/*.txt
          if-no-files-found: warn
          retention-days: 30

      # 5. configurar GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # 6. preparar archivos para despliegue
      - name: Preparar archivos
        run: |
          mkdir public
          cp index.html public/index.html

      # 7. crear artefacto de publicacion
      - name: Subir archivos de publicacion
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      # 8. desplegar si las pruebas fueron exitosas
      - name: Desplegar aplicacion
        id: deployment
        uses: actions/deploy-pages@v4
